<!doctype html>
<html lang="en">
<head>
  <script>document.documentElement.setAttribute('data-auth-state','pending')</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>House planner · GR</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <meta name="description" content="A measured 3D model of 79 High Street — survey it in dollhouse view, walk it at eye height, and test taking walls out." />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
  <link rel="stylesheet" href="../assets/css/fonts.css" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/dashboard.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div data-include="components/header.html"></div>
  <div data-include="components/nav.html"></div>

  <main id="main" class="container hp-page">
    <header class="hp-head">
      <h1>House planner</h1>
      <p class="hp-sub" data-hp-address>Loading…</p>
      <p class="hp-caveat">
        Built from the estate agent floor plan, the architect's existing-plan sheet,
        the title plan and the photographs. Room dimensions are as drawn; everything
        else is listed under <strong>Not yet verified</strong> and is one number away
        from being right.
      </p>
    </header>

    <div class="hp-layout">
      <section class="hp-stage" data-hp-stage aria-label="3D model">
        <canvas data-hp-canvas class="hp-canvas" tabindex="0"
          aria-label="Interactive 3D model of the house"></canvas>
        <p class="hp-status" data-hp-status role="status" aria-live="polite">Loading the model…</p>
      </section>

      <aside class="hp-panel" data-hp-panel aria-label="Model controls"></aside>
    </div>
  </main>

  <div data-include="components/footer.html"></div>
  <script type="module" src="../assets/js/components.js"></script>
  <script type="module" src="../assets/js/page-house-planner.js"></script>
</body>
</html>
