# probe-rightmove.yml — Phase 0 gating checks for the Search Profiles plan.
#
# WHY: the fetcher's spend levers have never been verified against the actor's real
# input schema, and one of them looks backwards — tests/contract/fetch-spend.test.js
# pins `monitoringMode: false` with the comment "it re-bills", while the actor's own
# docs describe monitoring as the mechanism that STOPS re-billing. If that is right,
# every scheduled run has been re-paying for listings we already hold.
#
# This repo has been burned once by an unverified wire parameter: an off-ladder
# `radius=6.9` silently returned ZERO results on 36 of 56 targets for months
# (ADR 0011). So nothing in tools/fetch-listings.mjs changes until this reports.
#
# TWO TRIGGERS, no schedule:
#   1. workflow_dispatch — a human picks the probe set in the Actions UI.
#   2. push touching .github/probe-request.txt ONLY — so an agent that can push but
#      holds no `actions: write` scope can still run a probe and read the result.
#      Nothing else in the repo can fire this; the path filter is the whole gate.
#      The request file names the probe set, and defaults to H (free) when silent.
#
# Default probe set is H, which is FREE — it only reads the actor schema and the
# recent runs' real charges. Paid probes must be named explicitly and each prints
# its own observed cost.
#
# Runs under the shared fetch concurrency group so a probe can never overlap a
# scheduled fetch on the same Apify account.

name: probe-rightmove

on:
  workflow_dispatch:
    inputs:
      probes:
        description: 'Comma-separated: H (free schema+charges), I (empty-search cost), J (monitoringMode), K (cheap-mode fields), A (exact price band), F (outcode disjointness)'
        default: 'H'
      outcode:
        description: 'Outcode to probe against'
        default: 'SP11'
      outcode2:
        description: 'Adjacent outcode, probe F only'
        default: 'SP4'
      price:
        description: 'Exact price to probe with'
        default: '400000'
      profile_ids:
        description: 'dryrun-profiles only: comma-separated search_profiles ids. Blank falls back to the request file.'
        default: ''
      task:
        description: 'probe (default) or dryrun-profiles — a DRY RUN of the profile lane. Zero Apify spend either way; dryrun-profiles makes no actor call at all.'
        default: 'probe'
  push:
    paths:
      - '.github/probe-request.txt'

permissions:
  contents: read

concurrency:
  group: fetch-listings-daily
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # DRY RUN of the profile lane. Proves profiles load, areas resolve, targets
      # build and the search URLs are right — against LIVE data, with no Apify call
      # (DRY_RUN short-circuits before fetchRawForOutcode). Zero spend by
      # construction, which is why it is safe to fire from a push.
      - name: Dry-run the profile lane
        if: ${{ contains(inputs.probes, 'dryrun') || contains(inputs.task, 'dryrun') }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: '1'
          SEARCH_MODE: cluster
          PROFILE_IDS: ${{ inputs.profile_ids }}
        run: |
          set -euo pipefail
          REQ=.github/probe-request.txt
          val() { [ -f "$REQ" ] && grep -E "^$1=" "$REQ" | tail -1 | cut -d= -f2- | tr -d '"'"'"' ' || true; }
          export PROFILE_IDS="${PROFILE_IDS:-$(val profile_ids)}"
          echo "PROFILE_IDS=${PROFILE_IDS:-<none: scheduled profiles only>}"
          node tools/fetch-listings.mjs

      - name: Probe Rightmove + Apify parameters
        if: ${{ !contains(inputs.probes, 'dryrun') && !contains(inputs.task, 'dryrun') }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR_ID: ${{ secrets.APIFY_ACTOR_ID }}
          IN_PROBES: ${{ inputs.probes }}
          IN_OUTCODE: ${{ inputs.outcode }}
          IN_OUTCODE2: ${{ inputs.outcode2 }}
          IN_PRICE: ${{ inputs.price }}
        run: |
          set -euo pipefail
          REQ=.github/probe-request.txt
          # Read a key from the request file. Deliberately parsed, never sourced —
          # a committed file should not be able to execute anything on the runner.
          val() { [ -f "$REQ" ] && grep -E "^$1=" "$REQ" | tail -1 | cut -d= -f2- | tr -d '"'"'"' ' || true; }
          PROBES="${IN_PROBES:-$(val probes)}"
          OUTCODE="${IN_OUTCODE:-$(val outcode)}"
          OUTCODE2="${IN_OUTCODE2:-$(val outcode2)}"
          PRICE="${IN_PRICE:-$(val price)}"
          node tools/probe-rightmove-params.mjs \
            --only="${PROBES:-H}" \
            --outcode="${OUTCODE:-SP11}" \
            --outcode2="${OUTCODE2:-SP4}" \
            --price="${PRICE:-400000}"
