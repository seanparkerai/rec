# fetch-listings — v3 L1 listing fetcher.
# Runs tools/fetch-listings.mjs on a GitHub runner (which has internet, unlike the
# Claude sandbox). Writes normalised rows into the Supabase `listings` table via
# the service role.
#
# MANUAL ONLY (owner directive 2026-09-04, docs/adr/0012). No Apify run may start
# by itself. This workflow has exactly ONE trigger — workflow_dispatch — and every
# dispatch is a deliberate human act behind a confirmation:
#   - Portal "Pull listings" buttons (24hr / 3d / 7d / 14d) on the Listings page and
#     "Run now" on a search profile: native <dialog> confirmation → Supabase RPC
#     (request_rightmove_fetch / request_profile_fetch) → private.dispatch_fetch_now
#     → this workflow's workflow_dispatch API. The GitHub token lives only in Vault.
#   - The Actions tab "Run workflow" button (phone-friendly), with the inputs below.
#
# What was REMOVED and must not come back without its own ADR:
#   - the `schedule:` block (twelve UTC ticks bracketing six Europe/London slots) and
#     the once-per-slot gate step that de-duplicated them;
#   - the `push:` trigger that fired a run whenever this file changed on main.
# The punctual Supabase pg_cron dispatch jobs (rightmove-fetch-*-london-*) still
# exist but are INACTIVE, and their target function refuses to dispatch while
# fetch_control.auto_fetch_enabled is false. The admin panel
# (live-feed/search-control.html → "Automatic fetches") is the one place that
# re-arms them, behind a confirmation. See docs/FETCH_SCHEDULE.md.
# tests/contract/no-automatic-apify-runs.test.js pins all of this.
#
# Requires repo secrets: APIFY_TOKEN, APIFY_ACTOR_ID, SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY.
#
# Cost guardrail: APIFY_MAX_BUDGET_USD (default 25) is passed as the RUN OPTION
# maxTotalChargeUsd, which caps the total charged across every pricing model.
# CORRECTED 2026-08-27 (probe H, docs/PHASE0-PROBE-FINDINGS.md): this file used to
# claim the cap was the input field `maxBudget` and that "no overrun is possible".
# Neither `maxBudget` nor `maxItems` is a field on this actor's input schema — both
# were silently ignored, so for as long as those comments stood there was in fact NO
# in-repo spend cap at all. The only limit that ever bound this system was the Apify
# account's own monthly cap, which appears nowhere in this repo.
# results_per_target now sets `maxProperties`, the per-URL cap the actor really reads. It is a CAP, not a
# quantity: the actor bills per result actually RETURNED, so headroom costs nothing
# unless the listings genuinely exist — and if they do, they are precisely the listings
# a lower cap would have dropped. A target that FILLS the cap is silently truncated, so
# the cap is set well clear of any plausible real return (the ⚠ TRUNCATED sentinel in
# tools/fetch-listings.mjs names any target that still hits it).
# Typical daily top-up (24h, cluster): a few tens of results → ~$0.10/run. A portal
# 14-day catch-up across all targets: low hundreds of results → well under $1. The $25
# maxTotalChargeUsd bounds each actor run regardless of the cap.
# Scope is unaffected by the cap: the demand gate and the coordinate geofence confine
# every result to the household's own areas and their drawn radius.
name: fetch-listings

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch + normalise only, do not write'
        type: boolean
        default: false
      profile_ids:
        description: 'Lane B only: comma-separated search_profiles ids to run. When set, trigger_mode is ignored so a manual-only profile runs. Blank = scheduled profiles only.'
        default: ''
      foundation_mode:
        description: 'Foundation pull (14-day backfill). ALWAYS dry-run first to review projected cost before enabling writes.'
        type: boolean
        default: false
      max_days_since_added:
        description: 'Recency window in days. Rightmove accepts 1, 3, 7, 14 only; any other value returns 0 results. Ignored when foundation_mode is on (forces 14).'
        type: choice
        default: '1'
        options:
          - '1'
          - '3'
          - '7'
          - '14'
      search_mode:
        description: 'Search granularity: outcode (whole districts), village (per-village disks), or cluster (recommended)'
        type: choice
        default: cluster
        options:
          - cluster
          - outcode
          - village
      fetch_limit:
        description: 'Max search targets to process (0 = all). Set 1 for a cheap validation run.'
        type: string
        default: '0'
      results_per_target:
        description: 'Max listings per search target. A CAP, not a quantity — Apify bills per result actually returned, so headroom is free unless the listings genuinely exist. Kept as a runaway guard, set well clear of any plausible real return so a pull is never silently truncated.'
        type: string
        default: '1000'
      cluster_cap_mi:
        description: 'Cluster disk cap (miles). Rightmove only accepts radius 0/0.25/0.5/1/3/5/10/15/20/30/40 — the emitted radius is snapped UP to that ladder, so a cap of 5 keeps disks tight instead of jumping to 10. Lower = tighter/less paid noise but more searches. 5≈69, 7≈43, 9≈34 searches.'
        type: string
        default: '5'
      apify_budget_usd:
        description: 'Hard USD spend cap passed to Apify actor. Actor self-terminates at this limit.'
        type: string
        default: '25'
      area_ids:
        description: 'Comma-separated area ids to restrict the fetch to (blank = all demand). Replaces the old one-off suzanne-backfill workflow: a targeted standing-stock pull is foundation_mode + this list.'
        type: string
        default: ''

permissions:
  contents: read

# Queue simultaneous dispatches behind each other (two people pressing "Pull" at
# once, or a probe overlapping a pull) so Apify is never hit twice at the same time.
# Do not cancel in-progress — let the first run finish.
concurrency:
  group: fetch-listings-daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Fetch listings
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR_ID: ${{ secrets.APIFY_ACTOR_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          # foundation_mode overrides the recency window to 14 days in the fetcher.
          # Portal dispatches send max_days_since_added explicitly (1/3/7/14); the
          # `|| '1'` fallback keeps any input-less dispatch on the 24h window.
          FOUNDATION_MODE: ${{ inputs.foundation_mode && '1' || '0' }}
          MAX_DAYS_SINCE_ADDED: ${{ inputs.max_days_since_added || '1' }}
          # Hard spend cap: actor self-terminates at this USD limit (PPE — no overrun).
          # Dispatch can override; the hardcoded default is $25.
          APIFY_MAX_BUDGET_USD: ${{ inputs.apify_budget_usd || '25' }}
          SEARCH_MODE: ${{ inputs.search_mode || 'cluster' }}
          FETCH_LIMIT: ${{ inputs.fetch_limit || '0' }}
          # Portal "Pull listings" dispatches (private.dispatch_fetch_now) send no
          # results_per_target, so they inherit the declared default above. That default
          # is therefore the ONE knob standing between a portal pull and silent
          # truncation — see the cost note in the header before lowering it.
          RESULTS_PER_OUTCODE: ${{ inputs.results_per_target || '1000' }}
          CLUSTER_CAP_MI: ${{ inputs.cluster_cap_mi || '5' }}
          # Optional per-area restriction (blank → all demand).
          AREA_IDS: ${{ inputs.area_ids || '' }}
          # Lane B: restrict the profile lane to named profiles (a "Run now" press).
          PROFILE_IDS: ${{ inputs.profile_ids || '' }}
        run: node tools/fetch-listings.mjs
